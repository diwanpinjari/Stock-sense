{% extends 'base.html' %}
{% block title %}Sign In - StockSense{% endblock %}
{% block content %}
<div style="max-width: 420px; margin: 40px auto;">
    <div class="card" style="padding: 32px;">
        <div style="text-align: center; margin-bottom: 24px;">
            <h2 style="color: var(--primary); font-size: 1.6rem;">StockSense</h2>
            <p style="color: var(--text-muted); font-size: 0.88rem; margin-top: 4px;">Log in to your inventory workspace</p>
        </div>

        <form method="POST" novalidate>
            {% csrf_token %}
            {% for field in form %}
                <div style="margin-bottom: 18px;">
                    <label style="display: block; font-weight: 600; font-size: 0.85rem; margin-bottom: 6px;">{{ field.label }}</label>
                    {{ field }}
                </div>
            {% endfor %}

            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px; margin-top: 10px;">Sign In</button>
        </form>

        <div style="display: flex; justify-content: space-between; margin-top: 20px; font-size: 0.85rem;">
            <a href="{% url 'password_reset_request' %}" style="color: var(--primary); text-decoration: none;">Forgot password?</a>
            <a href="{% url 'register' %}" style="color: var(--primary); text-decoration: none;">Create an account</a>
        </div>
    </div>
</div>
<style>
    .form-input { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 0.95rem; }
    .form-input:focus { outline: none; border-color: var(--primary); }
</style>
{% endblock %}
